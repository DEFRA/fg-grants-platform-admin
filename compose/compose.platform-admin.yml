services:
  fg-grants-platform-admin:
    build: .
    ports:
      - "3103:3103"
    env_file:
      - ".env"
    develop:
      watch:
        - path: ./src
          target: /home/node/src
          action: sync+restart
    environment:
      PORT: 3103
      NODE_ENV: production
      LOG_FORMAT: ecs
      REDIS_HOST: redis
      USE_SINGLE_INSTANCE_CACHE: true
      REDIS_TLS: false
      OIDC_DISCOVERY_URI: http://entra:3010/.well-known/openid-configuration
      APP_BASE_URL: http://localhost:3103
      SESSION_COOKIE_SECURE: false
      GAS_API_URL: http://gas:3102
      # The local access token fg-grants-core seeds into fg-gas-backend's
      # access_tokens collection for platform-admin to call grant-admin routes.
      GAS_SERVICE_TOKEN: gpa-gas-test-token-001
      LOGS_EXPLORER_BASE_URL: https://logs.dev.cdp-int.defra.cloud
    networks:
      - cdp-tenant
